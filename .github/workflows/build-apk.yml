name: Build Türkiye Canlı TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Prepare Live TV Project and Capacitor
      run: |
        # package.json yoksa olustur
        if [ ! -f package.json ]; then
          npm init -y
        fi
        
        # Capacitor paketlerini kur
        npm install @capacitor/core @capacitor/cli @capacitor/android
        
        # www klasorunu olustur ve Canlı TV web dosyalarini hazirla
        mkdir -p www
        
        if [ -f index.html ]; then
          cp index.html www/
        else
          echo "HATA: index.html bulunamadi! Lutfen Canli TV ana dosyanizi kok dizine ekleyin."
          exit 1
        fi
        
        # Varsa diger CSS ve JS dosyalarini kopyala
        cp -r *.css www/ 2>/dev/null || true
        cp -r *.js www/ 2>/dev/null || true
        cp -r assets www/ 2>/dev/null || true
        
        # Capacitor yapilandirma dosyasini olustur
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "com.turkiyecanlitv.app",
          "appName": "Türkiye Canlı TV",
          "webDir": "www",
          "bundledWebRuntime": false
        }
        EOF

        # Android platformunu ekle ve senkronize et
        npx cap add android
        npx cap sync android

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        # Bozuk önbellek dosyalarını ve kilitlenmeleri temizle
        rm -rf .gradle/caches/
        ./gradlew clean
        # Çakışmaları önlemek için daemon olmadan derle
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: turkiye-canli-tv-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
