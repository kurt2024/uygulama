name: Build APK from Web Files

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Prepare Project and Capacitor
      run: |
        # package.json yoksa olustur
        if [ ! -f package.json ]; then
          npm init -y
        fi
        
        # Capacitor paketlerini kur
        npm install @capacitor/core @capacitor/cli @capacitor/android
        
        # Yuklediginiz web dosyalarini Capacitor'un bekledigi 'www' klasorune tasi
        mkdir -p www
        cp index.html www/
        cp style.css www/
        cp app.js www/
        cp engine.js www/
        cp rhythms.js www/
        
        # Capacitor yapilandirma dosyasini olustur
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "com.proje.app",
          "appName": "Web App",
          "webDir": "www",
          "bundledWebRuntime": false
        }
        EOF

        # Android platformunu ekle ve senkronize et
        npx cap add android
        npx cap sync android

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
