name: Build Türkiye Canlı TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Find and Prepare Live TV Files
      run: |
        # package.json yoksa olustur
        if [ ! -f package.json ]; then
          npm init -y
        fi
        
        # Capacitor paketlerini kur
        npm install @capacitor/core @capacitor/cli @capacitor/android
        
        # www klasorunu olustur
        mkdir -p www
        
        # index.html dosyasini ana dizinde veya alt klasorlerde otomatik ara
        echo "index.html aranıyor..."
        found_index=$(find . -maxdepth 3 -name "index.html" -not -path "*/node_modules/*" -not -path "*/android/*" -not -path "*/www/*" | head -n 1)
        
        if [ -n "$found_index" ]; then
          echo "Bulundu ve kopyalandı: $found_index -> www/index.html"
          cp "$found_index" www/index.html
        else
          echo "HATA: Depoda hiçbir yerde index.html dosyası bulunamadı!"
          exit 1
        fi
        
        # Varsa diger CSS ve JS dosyalarini alt klasorlerden bulup kopyala
        for file in style.css app.js engine.js rhythms.js; do
          found_file=$(find . -maxdepth 3 -name "$file" -not -path "*/node_modules/*" -not -path "*/android/*" -not -path "*/www/*" | head -n 1)
          if [ -n "$found_file" ]; then
            echo "Bulundu ve kopyalandı: $found_file -> www/"
            cp "$found_file" www/
          fi
        done
        
        # Capacitor yapilandirma dosyasini olustur
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "com.turkiyecanlitv.app",
          "appName": "Türkiye Canlı TV",
          "webDir": "www",
          "bundledWebRuntime": false
        }
        EOF

        # Android platformunu ekle ve senkronize et
        npx cap add android
        npx cap sync android

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        
        # KRİTİK DÜZELTME: Bozuk jar ve önbellek kilitlerini tamamen temizle
        rm -rf ~/.gradle/caches/
        rm -rf ~/.gradle/daemon/
        
        # Gradle derlemesini daemon olmadan ve taze önbellekle çalıştır
        ./gradlew clean
        ./gradlew assembleDebug --no-daemon --refresh-dependencies --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: turkiye-canli-tv-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
