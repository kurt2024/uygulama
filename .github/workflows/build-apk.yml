name: Build APK from Web Files

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Find and Prepare Web Files
      run: |
        # package.json yoksa olustur
        if [ ! -f package.json ]; then
          npm init -y
        fi
        
        # Capacitor paketlerini kur
        npm install @capacitor/core @capacitor/cli @capacitor/android
        
        # www klasorunu olustur
        mkdir -p www
        
        # Proje icinde dosyalari arayip www klasorune tasiyan dongu
        echo "Web dosyalari araniyor ve kopyalaniyor..."
        
        for file in index.html style.css app.js engine.js rhythms.js; do
          found_file=$(find . -maxdepth 3 -name "$file" -not -path "*/node_modules/*" -not -path "*/android/*" -not -path "*/www/*" | head -n 1)
          if [ -n "$found_file" ]; then
            echo "Bulundu ve kopyalandi: $found_file -> www/$file"
            cp "$found_file" www/
          else
            echo "UYARI: $file dosyasi bulunamadi!"
          fi
        done
        
        # Capacitor yapilandirma dosyasini olustur
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "com.turkiyecanlitv.app",
          "appName": "Türkiye Canlı TV",
          "webDir": "www",
          "bundledWebRuntime": false
        }
        EOF

        # Android platformunu ekle ve senkronize et
        npx cap add android
        npx cap sync android

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        # Bozuk önbellek kilitlerini ve eski build artiklarini temizle
        ./gradlew clean
        # Derlemeyi tek iş parçacığıyla (parallel kapalı) ve taze cache ile çalıştır
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
